name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    # Match the api Dockerfile's python. setup-python@v5 can't provide 3.13 on
    # the runner's node:20 (Debian) job image, so run the whole job in a
    # python image. No node in here → actions/checkout won't run → manual
    # git checkout below.
    container: python:3.13-bookworm
    steps:
      - name: checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "http://token:${TOKEN}@forgejo:3000/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      # Fast fail on syntax errors before the slower dependency install.
      - name: python compile check
        run: python3 -m compileall -q api/app
      - name: install deps
        working-directory: api
        # `companion` (public repo on our forgejo) is a git+https dep in
        # requirements.txt. The CI sandbox can't reach git.thelunadog.com
        # (resolves to a firewalled RFC1918 address), but anonymous http to
        # forgejo:3000 works — rewrite the URL for this job only.
        run: |
          git config --global url."http://forgejo:3000/".insteadOf "https://git.thelunadog.com/"
          python3 -m pip install --no-cache-dir -r requirements.txt
      - name: pytest
        working-directory: api
        run: python3 -m pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Expo/React-Native TypeScript — full typecheck (same as the repo's
      # `npm run typecheck`).
      - name: npm ci
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: tsc --noEmit
        working-directory: frontend
        run: npx tsc --noEmit
      # Unit tests for the pure logic under src/lib — mainly the offline queue,
      # which is the one place a bug silently loses the user's training.
      - name: vitest
        working-directory: frontend
        run: npm test
      # The two checks that catch a broken *native* build without needing an
      # Apple/Google account or an SDK: dependency compatibility, and whether
      # the native projects generate at all. `expo prebuild` is the first thing
      # an EAS build does, so a config that fails here fails there.
      - name: expo doctor
        working-directory: frontend
        run: npx expo-doctor
      - name: native config generates
        working-directory: frontend
        run: npm run prebuild:check

  # The whole stack in a browser: real web build, real API, real SQLite. Split
  # from `web` because it needs python and a browser, and because a failure
  # here means something different — the pieces work but don't fit together.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: python for the api
        run: |
          apt-get update -qq && apt-get install -y -qq python3 python3-pip python3-venv
      - name: install api deps
        working-directory: api
        run: |
          git config --global url."http://forgejo:3000/".insteadOf "https://git.thelunadog.com/"
          python3 -m pip install --break-system-packages --no-cache-dir -r requirements.txt
      - name: npm ci
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # The API the bundle talks to is baked in at build time.
      - name: build the web bundle
        working-directory: frontend
        env:
          EXPO_PUBLIC_API_URL: http://127.0.0.1:8011
        run: npx expo export --platform web --output-dir dist
      # No dev database here, so the API starts with an empty catalog and the
      # suite creates the exercises it needs. See e2e/api.sh.
      - name: playwright
        working-directory: frontend
        env:
          CI: 'true'
        run: npx playwright test
      - uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
