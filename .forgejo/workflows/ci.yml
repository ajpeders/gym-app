name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    # Match the api Dockerfile's python. setup-python@v5 can't provide 3.13 on
    # the runner's node:20 (Debian) job image, so run the whole job in a
    # python image. No node in here → actions/checkout won't run → manual
    # git checkout below.
    container: python:3.13-bookworm
    steps:
      - name: checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "http://token:${TOKEN}@forgejo:3000/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      # Fast fail on syntax errors before the slower dependency install.
      - name: python compile check
        run: python3 -m compileall -q api/app
      - name: install deps
        working-directory: api
        # `companion` (public repo on our forgejo) is a git+ssh dep in
        # requirements.txt for dev machines. The CI sandbox can't reach
        # git.thelunadog.com (hairpin NAT is dropped) or SSH, but anonymous
        # http to forgejo:3000 works — rewrite the URL for this job only.
        run: |
          git config --global url."http://forgejo:3000/".insteadOf "ssh://git@git.thelunadog.com/"
          python3 -m pip install --no-cache-dir -r requirements.txt
      - name: pytest
        working-directory: api
        run: python3 -m pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Expo/React-Native TypeScript — full typecheck (same as the repo's
      # `npm run typecheck`).
      - name: npm ci
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: tsc --noEmit
        working-directory: frontend
        run: npx tsc --noEmit
