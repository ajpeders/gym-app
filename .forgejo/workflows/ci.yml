name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Fast fail on syntax errors before the slower dependency install.
      - name: python compile check
        run: python3 -m compileall -q api/app
      - name: install deps
        working-directory: api
        env:
          # `companion` lives in a PRIVATE Forgejo repo, so pip's git clone needs
          # credentials. Define FORGEJO_TOKEN in this repo's Actions secrets
          # (Settings → Actions → Secrets). Best-effort: if the secret is absent
          # the install still tries an unauthenticated clone.
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          if [ -n "$FORGEJO_TOKEN" ]; then
            git config --global credential.helper store
            printf 'https://oauth2:%s@git.thelunadog.com\n' "$FORGEJO_TOKEN" > "$HOME/.git-credentials"
          fi
          python3 -m pip install --no-cache-dir -r requirements.txt
          rm -f "$HOME/.git-credentials"
      - name: pytest
        working-directory: api
        run: python3 -m pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Expo/React-Native TypeScript — full typecheck (same as the repo's
      # `npm run typecheck`).
      - name: npm ci
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: tsc --noEmit
        working-directory: frontend
        run: npx tsc --noEmit
