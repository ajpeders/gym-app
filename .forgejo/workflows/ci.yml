name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Fast fail on syntax errors before the slower dependency install.
      - name: python compile check
        run: python3 -m compileall -q api/app
      - name: install deps
        working-directory: api
        env:
          # `companion` lives in a PRIVATE Forgejo repo, cloned over SSH. Put the
          # PRIVATE half of a read-only deploy key in the COMPANION_DEPLOY_KEY
          # Actions secret (repo Settings → Actions → Secrets); register its
          # PUBLIC half on the companion repo as a deploy key.
          COMPANION_DEPLOY_KEY: ${{ secrets.COMPANION_DEPLOY_KEY }}
        run: |
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$COMPANION_DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan git.thelunadog.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          python3 -m pip install --no-cache-dir -r requirements.txt
          rm -f "$HOME/.ssh/id_ed25519"
      - name: pytest
        working-directory: api
        run: python3 -m pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Expo/React-Native TypeScript — full typecheck (same as the repo's
      # `npm run typecheck`).
      - name: npm ci
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: tsc --noEmit
        working-directory: frontend
        run: npx tsc --noEmit
