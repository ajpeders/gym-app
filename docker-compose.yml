services:
  gym-api:
    container_name: gym-api
    build:
      context: ./api
    restart: unless-stopped
    environment:
      GYM_DATA_DIR: /data
      GYM_JWT_SECRET: ${GYM_JWT_SECRET:-}
      GYM_CORS_ORIGINS: ${GYM_CORS_ORIGINS:-*}
      # --- future AI (unused in Phase 1, harmless if unset) ---
      GYM_OLLAMA_URL: ${GYM_OLLAMA_URL:-http://192.168.0.40:11434}
      GYM_CLAUDE_API_KEY: ${GYM_CLAUDE_API_KEY:-}
    volumes:
      - ../../state/gym-app/api:/data
    # Published on the LAN so the Expo dev client (phone) can hit the API by
    # direct IP over HTTP, bypassing DNS/TLS/Traefik. Prod traffic still goes
    # through Traefik on 443 via the labels below.
    ports:
      - "8000:8000"
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      # Higher priority so /api beats the catch-all web router on the same host.
      - traefik.http.routers.gym-api.rule=Host(`${GYM_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.gym-api.priority=100
      - traefik.http.routers.gym-api.entrypoints=websecure
      - traefik.http.routers.gym-api.tls=true
      - traefik.http.routers.gym-api.tls.certresolver=letsencrypt
      - traefik.http.routers.gym-api.middlewares=local-only@file
      - traefik.http.services.gym-api.loadbalancer.server.port=8000
    networks:
      - web

  gym-web:
    container_name: gym-web
    build:
      context: ./frontend
      args:
        # Bare origin — the client appends the `/api` prefix itself.
        EXPO_PUBLIC_API_URL: "https://${GYM_DOMAIN}"
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.gym-web.rule=Host(`${GYM_DOMAIN}`)
      - traefik.http.routers.gym-web.entrypoints=websecure
      - traefik.http.routers.gym-web.tls=true
      - traefik.http.routers.gym-web.tls.certresolver=letsencrypt
      - traefik.http.routers.gym-web.middlewares=local-only@file
      - traefik.http.services.gym-web.loadbalancer.server.port=80
    networks:
      - web

networks:
  web:
    external: true
    name: web
