services:
  gym-api:
    container_name: gym-api
    build:
      context: ./api
    restart: unless-stopped
    environment:
      GYM_DATA_DIR: /data
      GYM_JWT_SECRET: ${GYM_JWT_SECRET:-}
      GYM_CORS_ORIGINS: ${GYM_CORS_ORIGINS:-*}
      # Signups are open: the public instance is linked as a live demo, and a
      # demo nobody can sign into is not a demo. What keeps that from being an
      # abuse endpoint is the gym-auth rate limit below, not this flag. Set
      # GYM_ALLOW_REGISTRATION=false in .env to close them again.
      GYM_ALLOW_REGISTRATION: ${GYM_ALLOW_REGISTRATION:-true}
      # --- AI (Phase 3): NL logging + coaching ---
      GYM_AI_PROVIDER: ${GYM_AI_PROVIDER:-ollama}
      GYM_OLLAMA_URL: ${GYM_OLLAMA_URL:-http://192.168.0.40:11434}
      GYM_OLLAMA_MODEL: ${GYM_OLLAMA_MODEL:-qwen2.5:7b-instruct}
      GYM_CLAUDE_API_KEY: ${GYM_CLAUDE_API_KEY:-}
      GYM_CLAUDE_MODEL: ${GYM_CLAUDE_MODEL:-claude-opus-4-8}
    volumes:
      - ../../state/gym-app/api:/data
    # No raw host port — API is reached only through Traefik (TLS) on 443 via
    # the labels below. (Removed 2026-07-08 security review: the old
    # `8000:8000` published plaintext HTTP + open Swagger on the whole LAN,
    # bypassing TLS/auth.) For Expo dev against a physical phone, temporarily
    # re-add `ports: ["127.0.0.1:8000:8000"]` + an `adb reverse`/ngrok tunnel,
    # or point the dev client at https://${GYM_DOMAIN}.
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      # Higher priority so /api beats the catch-all web router on the same host.
      - traefik.http.routers.gym-api.rule=Host(`${GYM_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.gym-api.priority=100
      - traefik.http.routers.gym-api.entrypoints=websecure
      - traefik.http.routers.gym-api.tls=true
      - traefik.http.routers.gym-api.tls.certresolver=letsencrypt
      - traefik.http.services.gym-api.loadbalancer.server.port=8000
      # The two credential endpoints get their own router purely so a rate
      # limit can sit on them. Higher priority than gym-api (100) so it wins;
      # exact Path rather than PathPrefix so the rest of /api/auth — notably
      # /auth/me, which the frontend hits on every load — is untouched.
      # Traefik resolves the real client IP here rather than Cloudflare's,
      # because the websecure entrypoint trusts CF's forwarded headers.
      - traefik.http.routers.gym-auth.rule=Host(`${GYM_DOMAIN}`) && (Path(`/api/auth/register`) || Path(`/api/auth/login`))
      - traefik.http.routers.gym-auth.priority=200
      - traefik.http.routers.gym-auth.entrypoints=websecure
      - traefik.http.routers.gym-auth.tls=true
      - traefik.http.routers.gym-auth.tls.certresolver=letsencrypt
      - traefik.http.routers.gym-auth.middlewares=gym-auth-limit
      - traefik.http.routers.gym-auth.service=gym-api
      - traefik.http.middlewares.gym-auth-limit.ratelimit.average=10
      - traefik.http.middlewares.gym-auth-limit.ratelimit.period=1m
      - traefik.http.middlewares.gym-auth-limit.ratelimit.burst=5
    networks:
      - web

  gym-web:
    container_name: gym-web
    build:
      context: ./frontend
      args:
        # Bare origin — the client appends the `/api` prefix itself.
        EXPO_PUBLIC_API_URL: "https://${GYM_DOMAIN}"
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      # Deliberately no `local-only@file` on either router: this instance is
      # linked from the public portfolio. The gate is JWT auth plus
      # GYM_ALLOW_REGISTRATION=false, not an IP allowlist.
      - traefik.http.routers.gym-web.rule=Host(`${GYM_DOMAIN}`)
      - traefik.http.routers.gym-web.entrypoints=websecure
      - traefik.http.routers.gym-web.tls=true
      - traefik.http.routers.gym-web.tls.certresolver=letsencrypt
      - traefik.http.services.gym-web.loadbalancer.server.port=80
    networks:
      - web

networks:
  web:
    external: true
    name: web
